[project]
name = "options-portal-hybrid"
version = "0.1.0"
description = "Hybrid scorer and single-leg options recommender"
requires-python = ">=3.12"
dependencies = ["options-portal-domain"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
