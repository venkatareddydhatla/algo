[project]
name = "options-portal-sentiment"
version = "0.1.0"
description = "VADER + FinBERT stub sentiment scorers"
requires-python = ">=3.12"
dependencies = [
  "options-portal-domain",
  "vaderSentiment>=3.3.2",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
