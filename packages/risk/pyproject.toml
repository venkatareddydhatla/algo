[project]
name = "options-portal-risk"
version = "0.1.0"
description = "Risk gates and safe order router"
requires-python = ">=3.12"
dependencies = ["options-portal-domain", "options-portal-broker"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
