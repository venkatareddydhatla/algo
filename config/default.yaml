# Sample application config (non-secret).
# Secrets belong in environment / Docker secrets / Vault — see env.example.
# Copy to config/local.yaml and adjust; do not commit real tokens.

app:
  name: options-portal
  timezone: Asia/Kolkata
  bind_host: 127.0.0.1
  api_port: 8000
  log_level: INFO

trading:
  mode: dry_run          # dry_run | demo | live
  halt: false            # kill switch
  timeframe: 15m
  # Equity dry-run auto-orders (v1): CE bias → BUY shares; PE bias → SELL short.
  # Options single-leg CE/PE placement is deferred — paper equity only.
  equity:
    enabled: true
    share_qty: 1           # fixed shares per dry-run entry (config key)
    max_qty_per_symbol: 1  # risk cap for new entries (exits may close full open qty)
    # overnight_hold_min_hybrid_abs may also live under trading.session (session wins)
    # Paper ledger retention — see docs/options-portal-paper-retention.md
    paper_retention:
      auto_purge: false            # never auto-delete fills/positions during dry_run
      allow_purge_before_live: true  # explicit API/script purge when starting live
      live_min_retain_days: 90     # after live: keep fills ≥ this many days
  # Venkata’s volatile equities only (not full NSE F&O). Alias → CSV below.
  universe: volatile_fno50  # config/universe/volatile_fno50_underlyings.csv
  # symbols: volatile_fno50
  # symbols_file: config/universe/volatile_fno50_underlyings.csv
  # Full F&O (disabled): universe: nse_fno
  symbols_demo:          # small set for quick tests (use_symbols_demo: true)
    - NIFTY
    - BANKNIFTY
    - RELIANCE
    - TCS
  use_symbols_demo: false
  # 0 or null = unlimited (score entire configured universe). Positive N = first-N cap.
  max_active_symbols: 0
  scan_batch_size: 8     # concurrent symbols per worker batch (rate-limit friendly)
  # Expected cycle: short on ~48-name volatile list; longer under live broker ratelimit_rpm.
  session:
    # NSE equity/F&O regular session (IST); calendar holidays applied in code.
    # New entries [entries_open, no_new_entries_after) IST (09:30–15:20) via
    # is_trading_session — wait for first 15m candle (09:15–09:30) to complete.
    # Cash open + open-book ±2% risk exits still from open (09:15) to soft_flatten_until.
    # Soft flatten 15:28–15:40 IST. Overnight |h|≥0.85 + trend confirmed.
    open: "09:15"                  # cash / risk-exit window start
    entries_open: "09:30"          # no new entries before 09:30 IST
    close: "15:30"                 # NSE regular close
    no_new_entries_after: "15:20"  # no new opens after 15:20 IST
    soft_flatten_ist: "15:28"      # close unless overnight conviction + trend
    soft_flatten_until_ist: "15:40"  # inclusive end; refuse soft_flatten after this HH:MM
    soft_flatten_poll_interval_sec: 15  # open-book loop; independent of full scan
    overnight_hold_min_hybrid_abs: 0.85  # |hybrid| ≥ this + same-side + trend → overnight
    # Morning first-hour dynamic TP/stop — OFF while fixed ±2% is primary.
    # Kept for rollback (set enabled: true + fixed_pct_exit.enabled: false).
    morning_profit_book:
      enabled: false
      start_ist: "09:15"
      until_ist: "10:00"           # inclusive HH:MM; after 10:00 no morning TP/stop
      tp_min_pct: 1.0
      tp_atr_mult: 1.5
      stop_min_pct: 1.0
      stop_atr_mult: 1.25
      atr_period: 14
      exit_fraction: 1.0           # 1.0 full exit; 0.5 later for scale-out when qty>1
    user_hours_note: "09:15–15:40 IST (entries 09:30–15:20; soft flatten 15:28–15:40; overnight |h|≥0.85 + trend; fixed ±2% open exits; no hard 15:40 square-off)"
  # Pine equity dry-run (primary): EMA13/21 cross + next 15m candle fully clear of both EMAs.
  # buy  = prior crossover  AND open > both EMAs; sell = prior crossunder AND open < both.
  # ST/ADX/vol kept for diagnostics only (not buy/sell gate). Stocks-only dry_run.
  pine_signals:
    enabled: true
    ema_fast: 13
    ema_slow: 21
    su_len: 10
    su_mult: 3.0
    adx_len: 14
    use_adx: true
    adx_min: 20
    vol_ratio: 1.2
    vol_sma_len: 20
  # Light broader-market gate — disabled while Pine is primary (stocks-only still).
  market_sentiment:
    enabled: false
    symbols:
      - NIFTY
      - BANKNIFTY
    conflict_abs: 0.55
    disagree_min_abs: 0.25
  expiry:
    index_default: weekly      # NIFTY, BANKNIFTY
    stock_default: monthly     # RELIANCE, TCS, …
    avoid_expiry_after_ist: "15:00"  # same-day expiry cut-off unless overridden
  risk:
    max_lots_per_symbol: 2
    max_open_symbols: 10       # simultaneous open trades/symbols ceiling
    max_day_loss_inr: 25000
    max_premium_spread_pct: 2.0
    min_option_oi: 50000
    equity_share_qty: 1        # mirror of trading.equity.share_qty (risk gate default)
    max_equity_qty_per_symbol: 1
    require_news_context: false  # if true, skip orders when news pipeline degraded
    # Skip watchlist scoring + new entries when LTP/last close < ₹40.
    min_equity_price: 40.0
    # Fixed ±2% profit/stop on OPEN equity only (not an entry filter; ~15s poll).
    # Long: mark≥entry×1.02 → pct_profit_2; mark≤entry×0.98 → pct_stop_2
    # Short: mark≤entry×0.98 → pct_profit_2; mark≥entry×1.02 → pct_stop_2
    # Priority same tick: pct_stop/profit > profit_candle_protect >
    # (disabled ATR/morning) > soft_flatten.
    fixed_pct_exit:
      enabled: true
      profit_pct: 2.0
      stop_pct: 2.0
    # In-profit structure break on latest 15m vs prior (open book only).
    # Long: open < mid(prior) and close < prior.low → profit_candle_protect.
    # Short: open > mid(prior) and close > prior.high (symmetric).
    profit_candle_protect:
      enabled: true
    # All-day ATR trail + profit scale-out — OFF while fixed ±2% is primary.
    # Kept for rollback (set enabled: true + fixed_pct_exit.enabled: false).
    atr_trail_scale_out:
      enabled: false
      atr_period: 14
      stop_atr_mult: 2.0       # initial stop: uPnL ≤ −2.0×ATR → atr_stop
      stop_pct: 1.2            # ATR missing → −1.2% of entry
      trail_activate_atr_mult: 1.5  # activate when uPnL ≥ +1.5×ATR
      trail_activate_pct: 0.8  # ATR missing → +0.8%
      trail_atr_mult: 1.2      # trail stop = extreme ± 1.2×ATR (never loosen)
      profit_atr_mult: 2.5     # book when uPnL ≥ +2.5×ATR (RRR 2.5/2.0 = 1.25 ≥ 1.2)
      profit_pct: 1.2          # ATR missing → +1.2%
      scale_out_fraction: 0.5  # qty>1 only; qty=1 → full profit_book
      min_rrr: 1.2             # discretionary profit ≥ 1.2× initial risk
    # High-conviction multi-factor gate — OFF while Pine is primary entry engine.
    # Kept for rollback (set trading.pine_signals.enabled: false + enabled: true).
    high_conviction:
      enabled: false
      hybrid_floors:
        before_12_ist: 0.75      # |hybrid| ≥ 0.75 before 12:00 IST
        after_12_ist: 0.75       # same as morning (no midday raise to 0.80)
        after_1420_ist: 0.85     # strict late when rolling WR < 55%
        late_base_min_hybrid_abs: 0.75  # after 14:20 when rolling WR ≥ 55%
        late_base_wr_threshold: 0.55
        afternoon_after_ist: "12:00"
        late_after_ist: "14:20"
      # Score-filter OR only: top 10% of scan |hybrid| may pass under floor.
      # Other factors (MTF/RVOL/ATR/proximity/news/cooloff) still required.
      # Never forces a min-trade quota / does not fill slots with weak names.
      top_pct_scan:
        enabled: true
        pct: 0.10
      relative_volume:
        mult: 1.0                # last 15m vol ≥ 1.0× mean of prior 20 bars
        lookback_bars: 20
      atr:
        period: 14
        min_pct_of_price: 1.0    # ATR(14) > 1.0% of price
      proximity:
        atr_mult: 0.1            # block within 0.1×ATR of daily high/low
        skip_until_ist: "10:30"  # skip proximity until 10:30 IST (range forming)
      news:
        lookback_minutes: 60     # hard block only on clear 1h conflict
        fail_open: true          # missing/empty/neutral → pass
      cooloff:
        minutes: 120             # after any trade on symbol (same session)
        same_session_only: true
      capacity:
        max_open: 10
        max_open_low_wr: 4       # when rolling WR < threshold
      win_rate:
        threshold: 0.50
        window_trips: 20         # last N closed equity round-trips (documented)
        min_trips: 5
      adaptive:
        enabled: true
        week_wr_threshold: 0.55  # raise |hybrid| floor when week WR < 55%
        step: 0.05
        clamp_lo: 0.70
        clamp_hi: 0.90
        lookback_trading_days: 5
      exit:
        min_rrr: 1.2
    # Entry selection ranking — OFF while Pine fires buy/sell immediately.
    entry_selection:
      enabled: false
      rank_by: abs_hybrid
      anti_churn: empty_slots_only
      reentry_cooloff:
        enabled: true
        minutes: 120             # after any trade (entry or exit)
        same_session_only: true  # IST NSE session day via pnl_ist_day
      morning_session:
        enabled: false           # superseded by high_conviction time floors
        until_ist: "10:00"
        min_hybrid_abs: 0.75
        max_new_entries: 3
      dynamic_capacity:
        enabled: true
        floor: 2
        ceiling: 10              # mirrors max_open_symbols
        min_hybrid_abs: 0.75     # base; session_min_hybrid_abs by clock (+ late WR)
        afternoon_after_ist: "12:00"
        afternoon_min_hybrid_abs: 0.75

hybrid:
  weights:
    tech: 0.65
    news: 0.35
  enter_long: 0.45
  enter_short: -0.45
  news_veto_abs: 0.70      # conflict with TA → HOLD
  news_lookback_minutes: 180

ta:
  # Legacy confluence plugins (unused when trading.pine_signals.enabled).
  plugins:
    - name: rsi
      period: 14
    - name: ema_cross
      fast: 13
      slow: 21
    - name: supertrend
      atr_period: 10
      multiplier: 3.0
    - name: vwap
      session_anchored: true
  pine:
    ema_fast: 13
    ema_slow: 21
    su_len: 10
    su_mult: 3.0
    adx_len: 14
    use_adx: true
    adx_min: 20
    vol_ratio: 1.2
    vol_sma_len: 20

options_recommender:
  style: single_leg        # v1; future: vertical
  index_strike_step: 50    # NIFTY; BANKNIFTY often 100 — override per symbol below
  stock_strike_step: auto  # from chain
  atm_offset: 0
  prefer_delta_band: [0.35, 0.55]
  per_symbol:
    NIFTY:
      strike_step: 50
      lot_size: 25          # verify against current NSE circular
    BANKNIFTY:
      strike_step: 100
      lot_size: 15
    RELIANCE:
      lot_size: 250
    TCS:
      lot_size: 175

broker:
  driver: upstox
  # credentials via env: UPSTOX_API_KEY, UPSTOX_API_SECRET, UPSTOX_ACCESS_TOKEN,
  # UPSTOX_REDIRECT_URI (optional refresh), UPSTOX_REFRESH_TOKEN (optional)
  ratelimit_rpm: 30
  candle_history_days: 5
  retry:
    max_attempts: 5
    base_delay_ms: 400
    max_delay_ms: 10000
    jitter: true

news:
  poll_interval_sec: 120
  timeout_sec: 15
  ingest_lookback_minutes: 2880  # 48h — market feeds often lag overnight
  # Portal News page shows today's IST live feed only (history not displayed).
  # Daily archive moves prior days into news_items_history until quarter-end.
  retention:
    live: today_ist
    history: until_quarter_end
  sources:
    # moneycontrol latestnews.xml currently looks stale (2024 items) — keep disabled
    - id: moneycontrol
      type: rss
      enabled: false
      url: "https://www.moneycontrol.com/rss/latestnews.xml"
    - id: economic_times
      type: rss
      enabled: true
      url: "https://economictimes.indiatimes.com/markets/rssfeeds/1977021501.cms"
    - id: livemint
      type: rss
      enabled: true
      url: "https://www.livemint.com/rss/markets"
    # Official exchange/regulator feeds — disabled until real URLs are confirmed.
    - id: nse_notices
      type: rss
      enabled: false
      url: "REPLACE_WITH_OFFICIAL_NSE_NOTICES_FEED"
    - id: bse_notices
      type: rss
      enabled: false
      url: "REPLACE_WITH_OFFICIAL_BSE_NOTICES_FEED"
    - id: sebi
      type: rss
      enabled: false
      url: "REPLACE_WITH_OFFICIAL_SEBI_FEED"
  # Confirm each URL/ToS before production use. Live rows persist to SQLite (local profile).

sentiment:
  vader:
    enabled: true
  finbert:
    enabled: false
    base_url: "http://127.0.0.1:8081"
    timeout_ms: 1500
    fallback_to_vader: true

notify:
  channels:
    - type: console
      enabled: true
    - type: gmail
      enabled: true
      # GMAIL_APP_PASSWORD required (local .env only — never commit)
      # optional: GMAIL_USER, NOTIFY_EMAIL_TO (default venkatareddy.dhatla@gmail.com)
    - type: telegram
      enabled: false
      # TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_ID from env
    - type: webhook
      enabled: false
      url_env: ALERT_WEBHOOK_URL
  daily_summary:
    enabled: true
    hour_ist: 16
    minute_ist: 0
    # Worker polls on this cadence (independent of full-universe scan length).
    poll_interval_sec: 30

persistence:
  postgres_url_env: DATABASE_URL
  redis_url_env: REDIS_URL

ui:
  guest_hide_pnl: true
  default_symbols: volatile_fno50   # volatile equities watchlist; UI paginates
  page_size: 50

backtest:
  slippage_bps: 5
  fee_model: approximate_inr_fno_v1
  holiday_calendar: nse_fo

health:
  candle_max_age_minutes: 20
  worker_heartbeat_max_sec: 90
  check_interval_sec: 30
