# Sample application config (non-secret).
# Secrets belong in environment / Docker secrets / Vault — see env.example.
# Copy to config/local.yaml and adjust; do not commit real tokens.

app:
  name: options-portal
  timezone: Asia/Kolkata
  bind_host: 127.0.0.1
  api_port: 8000
  log_level: INFO

trading:
  mode: dry_run          # dry_run | demo | live
  halt: false            # kill switch
  timeframe: 15m
  # Equity dry-run auto-orders (v1): CE bias → BUY shares; PE bias → SELL short.
  equity:
    enabled: true
    share_qty: 1
    max_qty_per_symbol: 1
    # Paper ledger: keep dry-run fills until explicit purge before live.
    paper_retention:
      auto_purge: false
      allow_purge_before_live: true
      live_min_retain_days: 90
  # Venkata’s volatile equities only (not full NSE F&O). Alias → CSV below.
  universe: volatile_fno50  # config/universe/volatile_fno50_underlyings.csv
  # symbols: volatile_fno50
  # symbols_file: config/universe/volatile_fno50_underlyings.csv
  # Full F&O (disabled): universe: nse_fno
  symbols_demo:          # small set for quick tests (use_symbols_demo: true)
    - NIFTY
    - BANKNIFTY
    - RELIANCE
    - TCS
  use_symbols_demo: false
  # 0 or null = unlimited (score entire configured universe). Positive N = first-N cap.
  max_active_symbols: 0
  scan_batch_size: 8     # concurrent symbols per worker batch (rate-limit friendly)
  # Every 15m candle: re-score ALL active symbols (Reversal Pro Action + entries/exits).
  # Open-book ±2% still on soft_flatten_poll; no reentry cooloff.
  scan_on_bar_close: true
  bar_close_settle_sec: 8
  # Expected cycle: short on ~49-name volatile list; must finish inside 15m.
  session:
    # Entries 09:30–15:20 (wait first 15m); cash/risk from 09:15; soft flatten 15:28.
    open: "09:15"
    entries_open: "09:30"
    close: "15:30"
    no_new_entries_after: "15:20"
    soft_flatten_ist: "15:28"
    soft_flatten_until_ist: "15:40"
    soft_flatten_poll_interval_sec: 15
    overnight_hold_min_hybrid_abs: 0.85
    morning_profit_book:
      enabled: false
      start_ist: "09:15"
      until_ist: "10:00"
      tp_min_pct: 1.0
      tp_atr_mult: 1.5
      stop_min_pct: 1.0
      stop_atr_mult: 1.25
      atr_period: 14
      exit_fraction: 1.0
    user_hours_note: "09:15–15:40 IST (entries 09:30–15:20; soft flatten 15:28–15:40; overnight |h|≥0.85 + trend; fixed ±2% open exits; no hard 15:40 square-off)"
  # NPR21 Reversal Detection Pro v3.2 (Confirmed Only). See docs/pine-reversal-pro-v32.pine.
  pine_signals:
    enabled: true
    confirmation_mode: "Confirmed Only"
    confirmation_bars: 0
    sensitivity: Medium
    method: average
    atr_length: 14
    average_length: 5
    require_strong: true   # U1/D1 + EMA9/14/21 trend; set false for raw U1/D1
    ema_superfast: 9
    ema_fast: 14
    ema_slow: 21
  market_sentiment:
    enabled: false
    symbols:
      - NIFTY
      - BANKNIFTY
    conflict_abs: 0.55
    disagree_min_abs: 0.25
  expiry:
    index_default: weekly      # NIFTY, BANKNIFTY
    stock_default: monthly     # RELIANCE, TCS, …
    avoid_expiry_after_ist: "15:00"  # same-day expiry cut-off unless overridden
  risk:
    max_lots_per_symbol: 2
    max_open_symbols: 10
    max_day_loss_inr: 25000
    max_premium_spread_pct: 2.0
    min_option_oi: 50000
    equity_share_qty: 1
    max_equity_qty_per_symbol: 1
    require_news_context: false  # if true, skip orders when news pipeline degraded
    min_equity_price: 40.0
    fixed_pct_exit:
      enabled: true
      profit_pct: 2.0
      stop_pct: 2.0
    profit_candle_protect:
      enabled: true
    opposite_pine_exit:
      enabled: true
    atr_trail_scale_out:
      enabled: false
      atr_period: 14
      stop_atr_mult: 2.0
      stop_pct: 1.2
      trail_activate_atr_mult: 1.5
      trail_activate_pct: 0.8
      trail_atr_mult: 1.2
      profit_atr_mult: 2.5
      profit_pct: 1.2
      scale_out_fraction: 0.5
      min_rrr: 1.2
    high_conviction:
      enabled: false
      hybrid_floors:
        before_12_ist: 0.75
        after_12_ist: 0.75
        after_1420_ist: 0.85
        late_base_min_hybrid_abs: 0.75
        late_base_wr_threshold: 0.55
        afternoon_after_ist: "12:00"
        late_after_ist: "14:20"
      top_pct_scan:
        enabled: true
        pct: 0.10
      relative_volume:
        mult: 1.0
        lookback_bars: 20
      atr:
        period: 14
        min_pct_of_price: 1.0
      proximity:
        atr_mult: 0.1
        skip_until_ist: "10:30"
      news:
        lookback_minutes: 60
        fail_open: true
      cooloff:
        minutes: 0
        same_session_only: true
      capacity:
        max_open: 10
        max_open_low_wr: 4
      win_rate:
        threshold: 0.50
        window_trips: 20
        min_trips: 5
      adaptive:
        enabled: true
        week_wr_threshold: 0.55
        step: 0.05
        clamp_lo: 0.70
        clamp_hi: 0.90
        lookback_trading_days: 5
      exit:
        min_rrr: 1.2
    entry_selection:
      enabled: false
      rank_by: abs_hybrid
      anti_churn: empty_slots_only
      reentry_cooloff:
        enabled: false
        minutes: 0
        same_session_only: true
      morning_session:
        enabled: false
        until_ist: "10:00"
        min_hybrid_abs: 0.75
        max_new_entries: 3
      dynamic_capacity:
        enabled: true
        floor: 2
        ceiling: 10
        min_hybrid_abs: 0.75
        afternoon_after_ist: "12:00"
        afternoon_min_hybrid_abs: 0.75

hybrid:
  weights:
    tech: 0.65
    news: 0.35
  enter_long: 0.45
  enter_short: -0.45
  news_veto_abs: 0.70      # conflict with TA → HOLD
  news_lookback_minutes: 180

ta:
  plugins:
    - name: rsi
      period: 14
    - name: ema_cross
      fast: 13
      slow: 21
    - name: supertrend
      atr_period: 10
      multiplier: 3.0
    - name: vwap
      session_anchored: true
  pine:
    ema_fast: 13
    ema_slow: 21
    su_len: 10
    su_mult: 3.0
    adx_len: 14
    use_adx: true
    adx_min: 20
    vol_ratio: 1.2
    vol_sma_len: 20

options_recommender:
  style: single_leg        # v1; future: vertical
  index_strike_step: 50    # NIFTY; BANKNIFTY often 100 — override per symbol below
  stock_strike_step: auto  # from chain
  atm_offset: 0
  prefer_delta_band: [0.35, 0.55]
  per_symbol:
    NIFTY:
      strike_step: 50
      lot_size: 25          # verify against current NSE circular
    BANKNIFTY:
      strike_step: 100
      lot_size: 15
    RELIANCE:
      lot_size: 250
    TCS:
      lot_size: 175

broker:
  driver: upstox
  # credentials via env: UPSTOX_API_KEY, UPSTOX_API_SECRET, UPSTOX_ACCESS_TOKEN,
  # UPSTOX_REDIRECT_URI (optional refresh), UPSTOX_REFRESH_TOKEN (optional)
  ratelimit_rpm: 30
  candle_history_days: 5
  retry:
    max_attempts: 5
    base_delay_ms: 400
    max_delay_ms: 10000
    jitter: true

news:
  poll_interval_sec: 120
  timeout_sec: 15
  ingest_lookback_minutes: 2880  # 48h — market feeds often lag overnight
  # Portal News page shows today's IST live feed only (history not displayed).
  retention:
    live: today_ist
    history: until_quarter_end
  sources:
    # moneycontrol latestnews.xml currently looks stale (2024 items) — keep disabled
    - id: moneycontrol
      type: rss
      enabled: false
      url: "https://www.moneycontrol.com/rss/latestnews.xml"
    - id: economic_times
      type: rss
      enabled: true
      url: "https://economictimes.indiatimes.com/markets/rssfeeds/1977021501.cms"
    - id: livemint
      type: rss
      enabled: true
      url: "https://www.livemint.com/rss/markets"
    # Official exchange/regulator feeds — disabled until real URLs are confirmed.
    - id: nse_notices
      type: rss
      enabled: false
      url: "REPLACE_WITH_OFFICIAL_NSE_NOTICES_FEED"
    - id: bse_notices
      type: rss
      enabled: false
      url: "REPLACE_WITH_OFFICIAL_BSE_NOTICES_FEED"
    - id: sebi
      type: rss
      enabled: false
      url: "REPLACE_WITH_OFFICIAL_SEBI_FEED"
  # Confirm each URL/ToS before production use. Live rows persist to SQLite (local profile).

sentiment:
  vader:
    enabled: true
  finbert:
    enabled: false
    base_url: "http://127.0.0.1:8081"
    timeout_ms: 1500
    fallback_to_vader: true

notify:
  channels:
    - type: console
      enabled: true
    - type: gmail
      enabled: true
      # GMAIL_APP_PASSWORD required (local .env only — never commit)
      # optional: GMAIL_USER, NOTIFY_EMAIL_TO (default venkatareddy.dhatla@gmail.com)
    - type: telegram
      enabled: false
      # TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_ID from env
    - type: webhook
      enabled: false
      url_env: ALERT_WEBHOOK_URL
  daily_summary:
    enabled: true
    hour_ist: 16
    minute_ist: 0
    # Worker polls on this cadence (independent of full-universe scan length).
    poll_interval_sec: 30

persistence:
  postgres_url_env: DATABASE_URL
  redis_url_env: REDIS_URL

ui:
  guest_hide_pnl: true
  default_symbols: volatile_fno50   # volatile equities watchlist; UI paginates
  page_size: 50

backtest:
  slippage_bps: 5
  fee_model: approximate_inr_fno_v1
  holiday_calendar: nse_fo

health:
  candle_max_age_minutes: 20
  worker_heartbeat_max_sec: 90
  check_interval_sec: 30
