# Sample application config (non-secret).
# Secrets belong in environment / Docker secrets / Vault — see env.example.
# Copy to config/local.yaml and adjust; do not commit real tokens.

app:
  name: options-portal
  timezone: Asia/Kolkata
  bind_host: 127.0.0.1
  api_port: 8000
  log_level: INFO

trading:
  mode: dry_run          # dry_run | demo | live
  halt: false            # kill switch
  timeframe: 15m
  equity:
    enabled: true
    share_qty: 1           # fixed shares per dry-run equity entry
    max_qty_per_symbol: 1
    # Paper fill marks: prefer live Upstox LTP on entry/exit/soft_flatten.
    # Fallback order (logged loudly): candle close → entry avg (PnL=0) → min price.
    paper_retention:
      auto_purge: false
      allow_purge_before_live: true
      live_min_retain_days: 90
  universe: nse_fno       # full NSE F&O indices + equities (config/universe/)
  symbols_demo:          # quick-test set (set use_symbols_demo: true)
    - NIFTY
    - BANKNIFTY
    - RELIANCE
    - TCS
  use_symbols_demo: false
  max_active_symbols: 0  # 0/null = score full NSE F&O universe; positive N = first-N cap
  scan_batch_size: 8     # concurrent symbols/batch; ~2-5 min/full dry-run pass on one machine
  session:
    # High-conviction multi-factor: entries 09:15–15:20; soft flatten 15:28.
    open: "09:15"
    close: "15:30"
    no_new_entries_after: "15:20"
    soft_flatten_ist: "15:28"
    soft_flatten_until_ist: "15:40"
    soft_flatten_poll_interval_sec: 15
    overnight_hold_min_hybrid_abs: 0.85
    morning_profit_book:
      enabled: true
      start_ist: "09:15"
      until_ist: "10:00"
      tp_min_pct: 1.0
      tp_atr_mult: 1.5
      stop_min_pct: 1.0
      stop_atr_mult: 1.25
      atr_period: 14
      exit_fraction: 1.0
    user_hours_note: "09:15–15:40 IST (entries 09:15–15:20; soft flatten 15:28–15:40; overnight |h|≥0.85 + trend; no hard 15:40 square-off)"
  market_sentiment:
    enabled: true
    symbols: [NIFTY, BANKNIFTY]
    conflict_abs: 0.55
    disagree_min_abs: 0.25
  expiry:
    index_default: weekly      # NIFTY, BANKNIFTY
    stock_default: monthly     # RELIANCE, TCS, …
    avoid_expiry_after_ist: "15:00"  # same-day expiry cut-off unless overridden
  risk:
    max_lots_per_symbol: 2
    max_open_symbols: 6
    max_day_loss_inr: 25000
    max_premium_spread_pct: 2.0
    min_option_oi: 50000
    equity_share_qty: 1
    max_equity_qty_per_symbol: 1
    require_news_context: false  # if true, skip orders when news pipeline degraded
    atr_trail_scale_out:
      enabled: true
      atr_period: 14
      stop_atr_mult: 2.0
      stop_pct: 1.2
      trail_activate_atr_mult: 1.5
      trail_activate_pct: 0.8
      trail_atr_mult: 1.2
      profit_atr_mult: 2.5
      profit_pct: 1.2
      scale_out_fraction: 0.5
      min_rrr: 1.2
    high_conviction:
      enabled: true
      hybrid_floors:
        before_12_ist: 0.75
        after_12_ist: 0.80
        after_1420_ist: 0.85
        afternoon_after_ist: "12:00"
        late_after_ist: "14:20"
      relative_volume:
        mult: 1.5
        lookback_bars: 20
      atr:
        period: 14
        min_pct_of_price: 1.2
      proximity:
        atr_mult: 0.2
      news:
        lookback_minutes: 60
      cooloff:
        minutes: 120
        same_session_only: true
      capacity:
        max_open: 6
        max_open_low_wr: 4
      win_rate:
        threshold: 0.50
        window_trips: 20
        min_trips: 5
      adaptive:
        enabled: true
        week_wr_threshold: 0.55
        step: 0.05
        clamp_lo: 0.70
        clamp_hi: 0.90
        lookback_trading_days: 5
      exit:
        min_rrr: 1.2
    entry_selection:
      enabled: true
      rank_by: abs_hybrid
      anti_churn: empty_slots_only
      reentry_cooloff:
        enabled: true
        minutes: 120
        same_session_only: true
      morning_session:
        enabled: false
        until_ist: "10:00"
        min_hybrid_abs: 0.75
        max_new_entries: 3
      dynamic_capacity:
        enabled: true
        floor: 2
        ceiling: 6
        min_hybrid_abs: 0.75
        afternoon_after_ist: "12:00"
        afternoon_min_hybrid_abs: 0.80

hybrid:
  weights:
    tech: 0.65
    news: 0.35
  enter_long: 0.45
  enter_short: -0.45
  news_veto_abs: 0.70      # conflict with TA → HOLD
  news_lookback_minutes: 180

ta:
  plugins:
    - name: rsi
      period: 14
    - name: ema_cross
      fast: 9
      slow: 21
    - name: supertrend
      atr_period: 10
      multiplier: 3.0
    - name: vwap
      session_anchored: true

options_recommender:
  style: single_leg        # v1; future: vertical
  index_strike_step: 50    # NIFTY; BANKNIFTY often 100 — override per symbol below
  stock_strike_step: auto  # from chain
  atm_offset: 0
  prefer_delta_band: [0.35, 0.55]
  per_symbol:
    NIFTY:
      strike_step: 50
      lot_size: 25          # verify against current NSE circular
    BANKNIFTY:
      strike_step: 100
      lot_size: 15
    RELIANCE:
      lot_size: 250
    TCS:
      lot_size: 175

broker:
  driver: upstox
  # credentials via env: UPSTOX_API_KEY, UPSTOX_API_SECRET, UPSTOX_ACCESS_TOKEN,
  # UPSTOX_REDIRECT_URI / UPSTOX_REFRESH_TOKEN (optional OAuth refresh)
  ratelimit_rpm: 30
  candle_history_days: 5
  retry:
    max_attempts: 5
    base_delay_ms: 400
    max_delay_ms: 10000
    jitter: true

news:
  poll_interval_sec: 120
  sources:
    - id: moneycontrol
      type: rss
      url: "https://www.moneycontrol.com/rss/latestnews.xml"
    - id: economic_times
      type: rss
      url: "https://economictimes.indiatimes.com/markets/rssfeeds/1977021501.cms"
    - id: livemint
      type: rss
      url: "https://www.livemint.com/rss/markets"
    - id: nse_notices
      type: rss
      url: "REPLACE_WITH_OFFICIAL_NSE_NOTICES_FEED"
    - id: bse_notices
      type: rss
      url: "REPLACE_WITH_OFFICIAL_BSE_NOTICES_FEED"
    - id: sebi
      type: rss
      url: "REPLACE_WITH_OFFICIAL_SEBI_FEED"
  # Confirm each URL/ToS before production use.

sentiment:
  vader:
    enabled: true
  finbert:
    enabled: false
    base_url: "http://127.0.0.1:8081"
    timeout_ms: 1500
    fallback_to_vader: true

notify:
  channels:
    - type: console
      enabled: true
    - type: gmail
      enabled: true
      # GMAIL_APP_PASSWORD required (local .env only — never commit)
      # optional: GMAIL_USER, NOTIFY_EMAIL_TO (default venkatareddy.dhatla@gmail.com)
    - type: telegram
      enabled: false
      # TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_ID from env
    - type: webhook
      enabled: false
      url_env: ALERT_WEBHOOK_URL
  daily_summary:
    enabled: true
    hour_ist: 16
    minute_ist: 0

persistence:
  postgres_url_env: DATABASE_URL
  redis_url_env: REDIS_URL

ui:
  guest_hide_pnl: true
  default_symbols: nse_fno
  page_size: 50

backtest:
  slippage_bps: 5
  fee_model: approximate_inr_fno_v1
  holiday_calendar: nse_fo

health:
  candle_max_age_minutes: 20
  worker_heartbeat_max_sec: 90
  check_interval_sec: 30
